name: AI CI/CD

# - Moi push / PR: cai thu vien, bien dich toan bo .py, import thu ung dung FastAPI.
# - Push len master (hoac chay tay): build image ai, day len GHCR, roi SSH vao Lightsail
#   chay deploy/deploy.sh ai trong repo backend (noi co docker-compose.prod.yml).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py seed_catalog.py src
      # Import khong mo ket noi DB (lifespan chi chay khi uvicorn khoi dong).
      - run: python -c "import main; print(main.app.title)"

  image:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy-ai
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
    steps:
      - name: Check deploy settings
        id: check
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::notice::Bo qua deploy: chua dat secret LIGHTSAIL_SSH_KEY / bien LIGHTSAIL_HOST."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy ai to Lightsail
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCMS_DIR: ${{ vars.VCMS_DIR || '~/vcms/veterinary-clinic-backend' }}
        with:
          host: ${{ vars.LIGHTSAIL_HOST }}
          username: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,VCMS_DIR
          command_timeout: 12m
          script: |
            set -e
            cd "${VCMS_DIR/#\~/$HOME}"
            git pull --ff-only origin master
            bash deploy/deploy.sh ai
